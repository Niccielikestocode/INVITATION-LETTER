<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de invitación</title>
<style>
:root {
  --fondo: #f4f2ee;
  --tarjeta: #ffffff;
  --tinta: #1b1a22;
  --suave: #6b6878;
  --linea: #dedbe6;
  --acento: #3b2fa0;
  --acento-oscuro: #2b2280;
  --error: #b3261e;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

[hidden] { display: none !important; }

:focus-visible {
  outline: 3px solid var(--acento);
  outline-offset: 2px;
}

header.top {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px 24px 0;
}

.top-fila {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

header.top h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 32px);
  line-height: 1.15;
}

header.top p {
  margin: 6px 0 0;
  color: var(--suave);
  max-width: 60ch;
}

.lang {
  flex: 0 0 auto;
  display: flex;
  padding: 4px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--tarjeta);
}

.lang button {
  min-width: 48px;
  padding: 8px 14px;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--tinta);
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.lang button[aria-pressed="true"] {
  background: var(--acento);
  color: #fff;
}

.tabs {
  display: none;
  gap: 8px;
  margin-top: 16px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--linea);
  border-radius: 12px;
  background: var(--tarjeta);
  color: var(--tinta);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.tabs button[aria-pressed="true"] {
  background: var(--acento);
  border-color: var(--acento);
  color: #fff;
}

.app {
  display: grid;
  grid-template-columns: minmax(0, 560px) minmax(0, 1fr);
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

.panel-form { min-width: 0; }

details {
  margin-bottom: 12px;
  border: 1px solid var(--linea);
  border-radius: 16px;
  background: var(--tarjeta);
}

summary {
  padding: 16px 20px;
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}

summary::-webkit-details-marker { display: none; }

summary::after {
  content: "+";
  float: right;
  font-weight: 400;
  color: var(--suave);
}

details[open] summary::after { content: "\2212"; }

.campos {
  display: grid;
  gap: 16px;
  padding: 0 20px 20px;
}

label.campo, .campo {
  display: grid;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
}

.ayuda {
  font-size: 13px;
  font-weight: 400;
  color: var(--suave);
}

input[type="text"],
input[type="url"],
input[type="tel"],
input[type="datetime-local"],
select,
textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: #fff;
  color: var(--tinta);
  font: inherit;
  font-weight: 400;
}

textarea { min-height: 96px; resize: vertical; }

input[type="file"] { font: inherit; font-size: 14px; }

.opciones {
  display: grid;
  gap: 8px;
}

.opcion {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 15px;
}

.opcion input { width: 18px; height: 18px; accent-color: var(--acento); }

.paletas {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.paleta {
  position: relative;
  display: grid;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--linea);
  border-radius: 12px;
  cursor: pointer;
}

.paleta input {
  position: absolute;
  opacity: 0;
  inset: 0;
  cursor: pointer;
}

.paleta:has(input:checked) {
  border-color: var(--acento);
  box-shadow: 0 0 0 2px var(--acento);
}

.paleta:has(input:focus-visible) { outline: 3px solid var(--acento); outline-offset: 2px; }

.tira {
  display: flex;
  height: 34px;
  overflow: hidden;
  border-radius: 8px;
}

.tira i { flex: 1; }

.nom { font-size: 14px; font-weight: 600; }

.acciones {
  position: sticky;
  bottom: 0;
  display: grid;
  gap: 8px;
  margin-top: 16px;
  padding: 16px 0 calc(16px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, transparent, var(--fondo) 24%);
}

.descargar {
  padding: 16px 24px;
  border: 0;
  border-radius: 14px;
  background: var(--acento);
  color: #fff;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.descargar:hover { background: var(--acento-oscuro); }
.descargar:active { transform: scale(0.99); }

#estado {
  margin: 0;
  font-size: 14px;
  color: var(--suave);
}

#estado.error { color: var(--error); font-weight: 600; }

#avisos {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--suave);
}

#avisos:empty { display: none; }

.panel-prev {
  position: sticky;
  top: 24px;
  align-self: start;
  height: calc(100svh - 48px);
  display: grid;
  place-items: center;
}

.marco {
  width: min(100%, 400px);
  height: 100%;
  max-height: 820px;
  border: 8px solid var(--tinta);
  border-radius: 36px;
  overflow: hidden;
  background: #000;
}

.marco iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

@media (max-width: 979px) {
  .tabs { display: flex; }
  .app { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  header.top { padding: 16px 16px 0; }
  .panel-prev { position: static; height: 78svh; }
  .app .panel-prev { display: none; }
  .app.ver-prev .panel-prev { display: grid; }
  .app.ver-prev .panel-form { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-fila">
    <div>
      <h1 data-i="titulo"></h1>
      <p data-i="sub"></p>
    </div>
    <div class="lang" role="group" data-aria="langAria">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="tabs">
    <button type="button" id="tabEditar" aria-pressed="true" data-i="tabEditar"></button>
    <button type="button" id="tabVer" aria-pressed="false" data-i="tabVer"></button>
  </div>
</header>

<div class="app" id="app">

  <form class="panel-form" id="form" onsubmit="return false" autocomplete="off">

    <details open>
      <summary data-i="sEvento"></summary>
      <div class="campos">
        <label class="campo"><span data-i="lIdioma"></span>
          <select id="invLang">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
          <span class="ayuda" data-i="hIdioma"></span>
        </label>
        <label class="campo"><span data-i="lEvento"></span>
          <input type="text" id="evento" maxlength="60">
        </label>
        <label class="campo"><span data-i="lSaludo"></span>
          <input type="text" id="saludo" maxlength="60">
        </label>
        <label class="campo"><span data-i="lSubtitulo"></span>
          <input type="text" id="subtitulo" maxlength="80">
        </label>
        <label class="campo"><span data-i="lMensaje"></span>
          <textarea id="mensaje" maxlength="400"></textarea>
        </label>
        <label class="campo"><span data-i="lFecha"></span>
          <input type="datetime-local" id="fecha" value="2026-12-12T18:00">
        </label>
        <label class="campo"><span data-i="lLugar"></span>
          <input type="text" id="lugar" maxlength="80">
        </label>
        <label class="campo"><span data-i="lDireccion"></span>
          <input type="text" id="direccion" maxlength="120">
        </label>
        <label class="campo"><span data-i="lEntrada"></span>
          <input type="text" id="entrada" maxlength="40">
        </label>
      </div>
    </details>

    <details>
      <summary data-i="sApertura"></summary>
      <div class="campos">
        <label class="campo"><span data-i="lIntroTitulo"></span>
          <input type="text" id="introTitulo" maxlength="60">
        </label>
        <label class="campo"><span data-i="lIntroSub"></span>
          <input type="text" id="introSub" maxlength="60">
        </label>
      </div>
    </details>

    <details>
      <summary data-i="sPaleta"></summary>
      <div class="campos">
        <div class="paletas" id="paletas" role="radiogroup" data-aria="aPaletas"></div>
      </div>
    </details>

    <details>
      <summary data-i="sMusica"></summary>
      <div class="campos">
        <div class="opciones" role="radiogroup" data-aria="aMusica">
          <label class="opcion"><input type="radio" name="musicaModo" value="none" checked><span data-i="oNinguna"></span></label>
          <label class="opcion"><input type="radio" name="musicaModo" value="archivo"><span data-i="oArchivo"></span></label>
          <label class="opcion"><input type="radio" name="musicaModo" value="ruta"><span data-i="oRuta"></span></label>
        </div>
        <div id="boxArchivo" hidden class="campo">
          <label class="campo"><span data-i="lArchivo"></span>
            <input type="file" id="audioArchivo" accept="audio/*">
          </label>
          <span class="ayuda" id="audioInfo"></span>
        </div>
        <div id="boxRuta" hidden>
          <label class="campo"><span data-i="lRuta"></span>
            <input type="text" id="audioRuta" value="cancion.mp3" maxlength="300">
            <span class="ayuda" data-i="hRuta"></span>
          </label>
        </div>
        <label class="campo"><span data-i="lSpotify"></span>
          <input type="url" id="spotify" placeholder="https://open.spotify.com/playlist/..." maxlength="400">
          <span class="ayuda" data-i="hSpotify"></span>
        </label>
        <label class="campo"><span data-i="lTituloSec"></span>
          <input type="text" id="musTitulo" maxlength="40">
        </label>
        <label class="campo"><span data-i="lTexto"></span>
          <input type="text" id="musTexto" maxlength="160">
        </label>
        <label class="campo"><span data-i="lBoton"></span>
          <input type="text" id="musBoton" maxlength="30">
        </label>
      </div>
    </details>

    <details>
      <summary data-i="sRsvp"></summary>
      <div class="campos">
        <label class="campo"><span data-i="lTelefono"></span>
          <input type="tel" id="telefono" inputmode="numeric" placeholder="573001234567" maxlength="20">
          <span class="ayuda" data-i="hTelefono"></span>
        </label>
        <label class="campo"><span data-i="lWamsg"></span>
          <input type="text" id="wamsg" maxlength="160">
        </label>
        <label class="campo"><span data-i="lTituloSec"></span>
          <input type="text" id="rsvpTitulo" maxlength="50">
        </label>
        <label class="campo"><span data-i="lTexto"></span>
          <input type="text" id="rsvpTexto" maxlength="160">
        </label>
        <label class="campo"><span data-i="lBoton"></span>
          <input type="text" id="rsvpBoton" maxlength="30">
        </label>
      </div>
    </details>

    <details>
      <summary data-i="sVest"></summary>
      <div class="campos">
        <label class="opcion"><input type="checkbox" id="vestMostrar" checked><span data-i="oVestMostrar"></span></label>
        <label class="campo"><span data-i="lVestTitulo"></span>
          <input type="text" id="vestTitulo" maxlength="50">
        </label>
        <label class="campo"><span data-i="lVestTipo"></span>
          <input type="text" id="vestTipo" maxlength="40">
        </label>
        <label class="campo"><span data-i="lVestDesc"></span>
          <input type="text" id="vestDesc" maxlength="160">
        </label>
      </div>
    </details>

    <details>
      <summary data-i="sCierre"></summary>
      <div class="campos">
        <label class="campo"><span data-i="lCierre"></span>
          <input type="text" id="cierre" maxlength="50">
        </label>
        <label class="campo"><span data-i="lFin"></span>
          <input type="text" id="finMsg" maxlength="80">
        </label>
      </div>
    </details>

    <div class="acciones">
      <ul id="avisos"></ul>
      <button type="button" class="descargar" id="descargar" data-i="bDescargar"></button>
      <p id="estado" aria-live="polite"></p>
    </div>

  </form>

  <div class="panel-prev">
    <div class="marco">
      <iframe id="vista" data-titulo="aVista" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </div>

</div>

<script type="text/plain" id="plantilla">
<!DOCTYPE html>
<html lang="{{HTMLLANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{NOCHE}}">
<meta name="color-scheme" content="dark">
<title>{{TAB}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  {{VARS}}
  --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --pad: clamp(20px, 6vw, 40px);
  --notch: 14px;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--noche);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100svh;
  overflow-x: hidden;
  background:
    radial-gradient(70% 45% at 85% 0%, var(--glow-1), transparent),
    radial-gradient(55% 35% at 0% 45%, var(--glow-2), transparent),
    radial-gradient(60% 40% at 100% 85%, var(--glow-3), transparent),
    var(--noche);
  color: var(--papel);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
}

body.bloqueado { overflow: hidden; }

button, a { font: inherit; }

:focus-visible {
  outline: 3px solid var(--champagne);
  outline-offset: 4px;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(28px, 8vh, 56px);
  padding: var(--pad);
  background:
    radial-gradient(60% 50% at 50% 40%, var(--intro-glow), transparent),
    var(--noche);
  text-align: center;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}

#intro.salir {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-texto h2 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(38px, 11vw, 64px);
  line-height: 1;
  transition: opacity 0.5s ease;
}

.intro-texto p {
  margin: 12px 0 0;
  color: var(--champagne);
  opacity: 0.8;
  transition: opacity 0.5s ease;
}

#intro.abierto .intro-texto h2,
#intro.abierto .intro-texto p { opacity: 0; }

.sobre {
  position: relative;
  width: min(86vw, 380px);
  aspect-ratio: 3 / 2;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  perspective: 900px;
  -webkit-tap-highlight-color: transparent;
}

.sobre > * {
  position: absolute;
  inset: 0;
}

.s-fondo { background: var(--indigo); }

.s-carta {
  inset: 8% 7% auto;
  height: 88%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 14px 10px;
  background: var(--papel);
  color: var(--tinta);
  text-align: center;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s;
}

.s-carta span { font-size: 13px; }

.s-carta strong {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(22px, 7vw, 30px);
  line-height: 1.05;
  overflow-wrap: anywhere;
}

.s-frente {
  z-index: 3;
  background: var(--frente);
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
}

.s-tapa {
  z-index: 4;
  background: var(--indigo-claro);
  clip-path: polygon(0 0, 100% 0, 50% 58%);
  transform-origin: 50% 0;
  transition: transform 0.6s ease, z-index 0s 0.3s;
}

.s-sello {
  inset: auto;
  z-index: 5;
  left: 50%;
  top: 58%;
  width: 17%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--rosa);
  box-shadow: inset 0 0 0 4px rgba(0, 0, 0, 0.18), 0 6px 18px rgba(0, 0, 0, 0.4);
  transform: translate(-50%, -50%);
  animation: latido 1.8s ease-in-out infinite;
  transition: opacity 0.3s ease;
}

@keyframes latido {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.12); }
}

#intro.abierto .s-tapa { transform: rotateX(180deg); z-index: 1; }
#intro.abierto .s-carta { transform: translateY(-62%); }
#intro.abierto .s-sello { opacity: 0; animation: none; }

.wrap {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 var(--pad);
}

.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(16px, 3vh, 28px);
  padding: 64px var(--pad);
  text-align: center;
}

.hero .saludo {
  margin: 0;
  color: var(--champagne);
  font-size: clamp(16px, 3.6vw, 20px);
}

.hero h1 {
  margin: 0;
  max-width: 100%;
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(56px, 17vw, 168px);
  line-height: 0.92;
  letter-spacing: -0.02em;
}

.hero .sub {
  margin: 0;
  color: var(--rosa);
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(26px, 6vw, 44px);
  line-height: 1.1;
}

.hero .cuando {
  margin: clamp(12px, 3vh, 32px) 0 0;
  padding: 10px 22px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  font-size: clamp(15px, 3.6vw, 19px);
}

.seccion { padding: clamp(40px, 8vw, 88px) 0; }

.mensaje {
  margin: 0 auto;
  max-width: 34ch;
  font-family: var(--serif);
  font-size: clamp(26px, 5.4vw, 40px);
  line-height: 1.25;
  text-align: center;
}

.cuenta {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  text-align: center;
}

.cuenta div {
  padding: 4px 4px;
  border-left: 1px solid var(--linea);
  font-size: clamp(12px, 2.8vw, 16px);
  color: var(--champagne);
}

.cuenta div:first-child { border-left: 0; }

.cuenta b {
  display: block;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(40px, 12vw, 92px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--papel);
}

.fin {
  min-height: 1.6em;
  margin: 20px 0 0;
  text-align: center;
  font-family: var(--serif);
  font-size: clamp(22px, 5vw, 32px);
  color: var(--rosa);
}

.ticket {
  display: grid;
  filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.4));
}

.t-arriba, .t-abajo {
  position: relative;
  background: var(--papel);
  color: var(--tinta);
  padding: clamp(24px, 6vw, 40px);
}

.t-arriba {
  border-radius: 24px 24px 0 0;
  -webkit-mask:
    radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
  mask:
    radial-gradient(circle var(--notch) at 0 100%, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 100%, #0000 98%, #000) right / 51% 100% no-repeat;
}

.t-abajo {
  border-radius: 0 0 24px 24px;
  -webkit-mask:
    radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
  mask:
    radial-gradient(circle var(--notch) at 0 0, #0000 98%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 0, #0000 98%, #000) right / 51% 100% no-repeat;
}

}

    var(--tinta) 10px 13px, transparent 13px 15px

  opacity: 0.8;
}

  padding: clamp(28px, 6vw, 48px);

  border-radius: 28px;
  text-align: center;
}

.bloque h2 {

  font-weight: 400;
  font-size: clamp(34px, 8vw, 52px);
  line-height: 1;
}

.bloque p {

}

.bloque .destacado {

.colores {

.colores i {

  height: 36px;

}

.colores i:nth-child(1) { background: var(--papel); }
.colores i:nth-child(2) { background: var(--indigo-claro); }
.colores i:nth-child(3) { background: var(--rosa); }

.separa { height: clamp(20px, 4vw, 32px); }

.boton {

  margin-top: 28px;

  color: var(--noche);

<script>
(function () {
  var fecha = new Date(document.body.dataset.fecha);
  var objetivo = fecha.getTime();

  var formatos = {
    largo: { weekday: "long", day: "numeric", month: "long", year: "numeric" },
    corta: { day: "numeric", month: "long", year: "numeric" },
    hora: { hour: "numeric", minute: "2-digit", hour12: true }
  };

  document.querySelectorAll("[data-f]").forEach(function (el) {
    el.textContent = new Intl.DateTimeFormat("{{LOCALE}}", formatos[el.dataset.f]).format(fecha);
  });

  var el = {
    d: document.getElementById("dias"),
    h: document.getElementById("horas"),
    m: document.getElementById("minutos"),
    s: document.getElementById("segundos"),
    fin: document.getElementById("fin")
  };

  function poner(nodo, valor) {
    if (nodo.textContent !== valor) nodo.textContent = valor;
  }

  var timer = null;

  function tick() {
    var resto = objetivo - Date.now();
    if (resto <= 0) {
      clearInterval(timer);
      timer = null;
      poner(el.d, "0"); poner(el.h, "00"); poner(el.m, "00"); poner(el.s, "00");
      el.fin.textContent = {{FIN_JSON}};
      return;
    }
    poner(el.d, String(Math.floor(resto / 86400000)));
    poner(el.h, String(Math.floor(resto % 86400000 / 3600000)).padStart(2, "0"));
    poner(el.m, String(Math.floor(resto % 3600000 / 60000)).padStart(2, "0"));
    poner(el.s, String(Math.floor(resto % 60000 / 1000)).padStart(2, "0"));
  }

  function iniciar() {
    if (timer === null) {
      tick();
      if (objetivo > Date.now()) timer = setInterval(tick, 1000);
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearInterval(timer);
      timer = null;
    } else if (objetivo > Date.now()) {
      iniciar();
    }
  });

  iniciar();

  var intro = document.getElementById("intro");
  var sobre = document.getElementById("sobre");
  var audio = document.getElementById("musica");
  var audioBtn = document.getElementById("audioBtn");
  var reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  sobre.addEventListener("click", function () {
    if (intro.classList.contains("abierto")) return;
    intro.classList.add("abierto");

    if (audio) {
      audio.play().then(function () {
        audioBtn.classList.add("visible");
      }).catch(function () {});
    }

    setTimeout(function () {
      intro.classList.add("salir");
      document.body.classList.remove("bloqueado");
    }, reducido ? 200 : 1700);

    setTimeout(function () {
      intro.remove();
    }, reducido ? 400 : 2700);
  }, { once: true });

  if (audio && audioBtn) {
    audioBtn.addEventListener("click", function () {
      var silenciado = audio.paused;
      if (silenciado) {
        audio.play().catch(function () {});
      } else {
        audio.pause();
      }
      audioBtn.setAttribute("aria-pressed", String(!silenciado));
      audioBtn.setAttribute("aria-label", silenciado ? {{L_SILENCIAR_JSON}} : {{L_ACTIVAR_JSON}});
    });
  }
})();
<\/script>

</body>
</html>
</script>

  function variables(c) {
    var v = {
      noche: c.noche, indigo: c.indigo, "indigo-claro": c.indigoClaro, champagne: c.champagne,
      papel: c.papel, tinta: c.tinta, rosa: c.rosa,
      linea: rgba(c.champagne, 0.25),
      "glow-1": rgba(c.indigoClaro, 0.45),
      "glow-2": rgba(c.rosa, 0.14),
      "glow-3": rgba(c.indigoClaro, 0.35),
      "intro-glow": mezcla(c.noche, c.indigo, 0.8),
      frente: mezcla(c.indigo, c.indigoClaro, 0.5),
      hover: mezcla(c.champagne, "#ffffff", 0.35),
      "noche-a": rgba(c.noche, 0.8),
      "tinta-s": rgba(c.tinta, 0.65),
      "tinta-l": rgba(c.tinta, 0.25)
    };
    return Object.keys(v).map(function (k) { return "--" + k + ": " + v[k] + ";"; }).join("\n  ");
  }

  function val(id) { return $(id).value.trim(); }

  function slug(s) {
    var r = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return r || t("archivoBase");
  }

  function modoMusica() {
    return document.querySelector('input[name="musicaModo"]:checked').value;
  }

  function bloqueAudio() {
    var modo = modoMusica();
    var src = "";

    if (modo === "archivo" && audioData) src = audioData;
    if (modo === "ruta" && val("audioRuta")) src = val("audioRuta");

    if (!src) return "";

    var icono =
      '<svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M11 5 6 9H3v6h3l5 4z"/>' +
      '<path d="M15.5 8.5a5 5 0 0 1 0 7"/>' +
      '<path d="M18.5 5.5a9 9 0 0 1 0 13"/>' +
      '</svg>' +
      '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M11 5 6 9H3v6h3l5 4z"/>' +
      '<path d="m16 9 5 6"/>' +
      '<path d="m21 9-5 6"/>' +
      '</svg>';

    return '<audio id="musica" src="' + esc(src) + '" loop preload="none"></audio>' +
      '<button id="audioBtn" type="button" aria-label="' +
      esc(INV[invLang].silenciar) +
      '" aria-pressed="false">' + icono + '</button>';
  }

  function bloqueVestimenta() {
    if (!$("vestMostrar").checked) return "";
    return '<section class="bloque">\n    <h2>' + esc(val("vestTitulo")) + '</h2>\n    <p class="destacado">' + esc(val("vestTipo")) +
      "</p>\n    <p>" + esc(val("vestDesc")) + '</p>\n    <div class="colores" aria-hidden="true"><i></i><i></i><i></i></div>\n  </section>';
  }

  function bloqueMusica() {
    var url = val("spotify");
    if (!url) { avisos.push(t("avisoMus")); return ""; }
    if (!/^https?:\/\/\S+$/i.test(url)) { avisos.push(t("avisoMusInv")); return ""; }
    return '<div class="separa"></div>\n\n  <section class="bloque">\n    <h2>' + esc(val("musTitulo")) + "</h2>\n    <p>" + esc(val("musTexto")) +
      '</p>\n    <a class="boton" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(val("musBoton")) + "</a>\n  </section>";
  }

  function bloqueRsvp() {
    var num = val("telefono").replace(/\D/g, "");
    if (!num) { avisos.push(t("avisoRsvp")); return ""; }
    if (num.length < 8 || num.length > 15) { avisos.push(t("avisoRsvpInv")); return ""; }
    var link = "https://wa.me/" + num + "?text=" + encodeURIComponent(val("wamsg"));
    return '<div class="separa"></div>\n\n  <section class="bloque">\n    <h2>' + esc(val("rsvpTitulo")) + "</h2>\n    <p>" + esc(val("rsvpTexto")) +
      '</p>\n    <a class="boton" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(val("rsvpBoton")) + "</a>\n  </section>";
  }

  function construir(esVista) {
    avisos = [];
    var paleta = PALETAS[Number(document.querySelector('input[name="paleta"]:checked').value)].c;
    var fecha = val("fecha") || "2026-12-12T18:00";
    if (fecha.length === 16) fecha += ":00";
    var inv = INV[invLang];

    var mapa = {
      HTMLLANG: inv.htmlLang,
      LOCALE: inv.locale,
      NOCHE: paleta.noche,
      TAB: esc(val("evento") || inv.invitacion),
      VARS: variables(paleta),
      FECHA: esc(fecha),
      INTRO_TITULO: esc(val("introTitulo")),
      INTRO_SUB: esc(val("introSub")),
      SALUDO: esc(val("saludo")),
      EVENTO: esc(val("evento")),
      SUBTITULO: esc(val("subtitulo")),
      MENSAJE: esc(val("mensaje")).replace(/\n/g, "<br>"),
      ENTRADA: esc(val("entrada")),
      LUGAR: esc(val("lugar")),
      DIRECCION: esc(val("direccion")),
      CIERRE: esc(val("cierre")),
      FIN_JSON: jsonSeguro(val("finMsg")),
      L_SILENCIAR_JSON: jsonSeguro(inv.silenciar),
      L_ACTIVAR_JSON: jsonSeguro(inv.activar),
      AUDIO: bloqueAudio(),
      VESTIMENTA: bloqueVestimenta(),
      MUSICA: bloqueMusica(),
      RSVP: bloqueRsvp()
    };

    ["fecha", "hora", "lugar", "dias", "horas", "min", "seg", "invitacion", "abrir", "cuenta", "fechaph"].forEach(function (k) {
      mapa["L_" + k.toUpperCase()] = esc(inv[k]);
    });

    var html = plantilla.replace(/\{\{(\w+)\}\}/g, function (m, k) {
      return Object.prototype.hasOwnProperty.call(mapa, k) ? mapa[k] : m;
    });

    if (esVista) {
      // En la vista previa se omite el sobre para ver el contenido de inmediato.
      html = html.replace(
        "</head>",
        "<style>" +
          "#intro{display:none!important}" +
          "body.bloqueado{overflow:auto!important}" +
          "#audioBtn{display:grid!important;place-items:center}" +
        "</style></head>"
      );
    }

    return html;
  }

  var vista = $("vista");
  var temporizador = null;

  function actualizar() {
    vista.srcdoc = construir(true);
    $("avisos").innerHTML = avisos.map(function (a) { return "<li>" + esc(a) + "</li>"; }).join("");
  }

  function programar() {
    clearTimeout(temporizador);
    temporizador = setTimeout(actualizar, 250);
  }

  function estado(texto, error) {
    var e = $("estado");
    e.textContent = texto;
    e.className = error ? "error" : "";
  }

  function renderAudioInfo() {
    $("audioInfo").textContent = t.apply(null, [audioInfo.k].concat(audioInfo.a));
  }

  function aplicarUi() {
    document.documentElement.lang = uiLang;
    document.title = t("tabTitle");
    document.querySelectorAll("[data-i]").forEach(function (el) { el.textContent = t(el.dataset.i); });
    document.querySelectorAll("[data-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.dataset.aria)); });
    document.querySelectorAll("[data-titulo]").forEach(function (el) { el.setAttribute("title", t(el.dataset.titulo)); });
    document.querySelectorAll(".paleta .nom").forEach(function (n, i) { n.textContent = PALETAS[i].nombre[uiLang]; });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.lang === uiLang));
    });
    renderAudioInfo();
  }

  function cambiarIdiomaInvitacion(nuevo) {
    var viejo = invLang;
    Object.keys(DEF.es).forEach(function (k) {
      var el = $(k);
      if (el && el.value === DEF[viejo][k]) el.value = DEF[nuevo][k];
    });
    invLang = nuevo;
    $("invLang").value = nuevo;
  }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      uiLang = b.dataset.lang;
      cambiarIdiomaInvitacion(uiLang);
      aplicarUi();
      estado("", false);
      actualizar();
    });
  });

  $("invLang").addEventListener("change", function (e) {
    cambiarIdiomaInvitacion(e.target.value);
    actualizar();
  });

  $("form").addEventListener("input", programar);
  $("form").addEventListener("change", programar);

  document.querySelectorAll('input[name="musicaModo"]').forEach(function (r) {
    r.addEventListener("change", function () {
      var m = modoMusica();
      $("boxArchivo").hidden = m !== "archivo";
      $("boxRuta").hidden = m !== "ruta";
    });
  });

  $("audioArchivo").addEventListener("change", function (e) {
    var f = e.target.files[0];
    audioData = "";
    if (!f) { audioInfo = { k: "audioNo", a: [] }; renderAudioInfo(); return; }
    if (f.size > 5 * 1024 * 1024) {
      e.target.value = "";
      audioInfo = { k: "audioGrande", a: [] };
      renderAudioInfo();
      return;
    }
    var lector = new FileReader();
    lector.onload = function () {
      audioData = lector.result;
      audioInfo = { k: "audioListo", a: [f.name, (f.size / 1048576).toFixed(2)] };
      renderAudioInfo();
      programar();
    };
    lector.onerror = function () {
      audioInfo = { k: "audioError", a: [] };
      renderAudioInfo();
      programar();
    };
    lector.readAsDataURL(f);
  });

  $("descargar").addEventListener("click", function () {
    if (!val("evento")) { estado(t("eNombre"), true); return; }
    if (!val("fecha")) { estado(t("eFecha"), true); return; }
    var modo = modoMusica();
    if (modo === "archivo" && !audioData) { estado(t("eAudio"), true); return; }
    if (modo === "ruta" && !val("audioRuta")) { estado(t("eRuta"), true); return; }

    var html = construir(false);
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = slug(val("evento")) + ".html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    estado(t("okDescarga", (blob.size / 1024).toFixed(0)), false);
  });

  var app = $("app");
  var tabEditar = $("tabEditar");
  var tabVer = $("tabVer");

  function pestana(ver) {
    app.classList.toggle("ver-prev", ver);
    tabEditar.setAttribute("aria-pressed", String(!ver));
    tabVer.setAttribute("aria-pressed", String(ver));
    if (ver) window.scrollTo(0, 0);
  }

  tabEditar.addEventListener("click", function () { pestana(false); });
  tabVer.addEventListener("click", function () { pestana(true); });

  Object.keys(DEF.es).forEach(function (k) { $(k).value = DEF.es[k]; });
  aplicarUi();
  actualizar();
})();
</script>

</body>
</html>
